# Multi-Agent PPO Training Configuration

# Environment Configuration
use_carla: false  # false = SUMO-only (fast), true = CARLA co-sim (for cameras/YOLO)
num_agents: null  # null = auto-detect from SUMO network
enable_ctde: true  # Centralized Training with Decentralized Execution
neighbor_radius: 1  # Maximum distance for neighbor detection

# Observation Configuration
observation_config:
  low: 0.0
  high: 10000.0
  max_episode_duration: 3600.0  # Maximum episode duration in seconds
  max_lanes_per_tls: 8  # Maximum lanes to observe per traffic light
  lane_metrics:  # Per-lane features to observe
    - queue_length      # Number of halting vehicles
    - waiting_count     # Total vehicles in lane
    - avg_speed         # Average speed in lane
    - occupancy         # Lane occupancy percentage

# Action Configuration
action_config:
  num_phases: 4  # Number of traffic light phases
  num_traffic_lights: null  # null = auto-detect
  min_duration: 10  # Minimum green phase duration in seconds
  max_duration: 90  # Maximum green phase duration in seconds
  duration_step: 10  # Duration step size (results in 9 options: 10,20,...,90)
  yellow_seconds: 3  # Yellow phase duration before switching to new green

# Video Recording Configuration
video_config:
  enabled: false  # Enable video recording during evaluation
  output_path: "videos"  # Directory for video output
  format: "mp4"  # Video format (mp4, avi)

# Device Configuration
device: "cpu"  # Force CPU training for MlpPolicy

# Training Configuration
n_envs: 1  # Number of parallel environments
learning_rate: 3.0e-4  # Reduced from 1e-3 to prevent policy collapse
n_steps: 2048  # Steps per update
batch_size: 128
n_epochs: 10  # Increased from 4 for better sample efficiency
gamma: 0.99  # Discount factor
gae_lambda: 0.95  # GAE lambda parameter
clip_range: 0.2  # PPO clip range
ent_coef: 0.1  # Entropy coefficient (increased for more exploration)
vf_coef: 0.5  # Value function coefficient
max_grad_norm: 0.5  # Maximum gradient norm

# Reward Configuration
reward_config:
  wait_time_scale: 120.0  # Normalization factor for wait time (slower exponential growth)
  new_waiting_scale: 20.0  # Normalization factor for new waiting cars
  max_reward: 100.0  # Reduced from 1000 to prevent value function explosion

# Policy Network Configuration
policy_kwargs:
  net_arch: [256, 256]  # Network architecture
  activation_fn: "relu"  # Activation function
